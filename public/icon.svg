<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />
  
  <!-- Ambient Audio Waves (Concentric Rings) -->
  <circle cx="256" cy="235" r="140" fill="none" stroke="#f43f5e" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="235" r="175" fill="none" stroke="#f59e0b" stroke-opacity="0.10" stroke-width="3" />
  <circle cx="256" cy="235" r="105" fill="none" stroke="#f43f5e" stroke-opacity="0.25" stroke-width="5" />

  <!-- Glowing Microphone Icon -->
  <g filter="url(#glow)">
    <!-- Mic Capsule Body -->
    <rect x="216" y="145" width="80" height="150" rx="40" fill="url(#accentGrad)" />
    
    <!-- Mic Pickup Cradle / Arc -->
    <path d="M 180 230 A 76 76 0 0 0 332 230" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
    
    <!-- Mic Stand Stem -->
    <line x1="256" y1="306" x2="256" y2="360" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
    
    <!-- Mic Stand Base -->
    <line x1="206" y1="360" x2="306" y2="360" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  </g>

  <!-- Brand Accent Dot / Voice Active Indicator -->
  <circle cx="256" cy="185" r="8" fill="#ffffff" />
</svg>
